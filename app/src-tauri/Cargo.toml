[package]
name = "im-board"
version = "3.0.1"
description = "Local-first IM intelligent dashboard"
authors = ["Codex"]
edition = "2021"
include = [
  "build.rs",
  "Cargo.toml",
  "src/**",
  "capabilities/**",
  "tauri.conf.json",
  "tauri.windows.conf.json",
]
exclude = [
  "UNC/**",
  "gen/**",
  "migrations/**",
]

[lib]
name = "im_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
flate2 = "1"
futures = "0.3"
jieba-rs = "0.9"
keyring = "4.1.6"
regex = "1"
ring = "=0.17.14"
zeroize = "=1.8.2"
rusqlite = { version = "0.32", features = ["backup", "bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
tar = "0.4"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png", "compression", "dynamic-acl"] }
thiserror = "2"
tokio = { version = "1.53.3", features = ["io-util", "sync", "process", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
macos-owned-process = { path = "../native/macos-owned-process" }
libc = "=0.2.186"

[target.'cfg(unix)'.dev-dependencies]
macos-owned-process = { path = "../native/macos-owned-process", features = ["test-support"] }
