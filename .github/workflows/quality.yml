name: Product quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-process-regressions:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Windows process and synthetic credential regressions
        run: python app/scripts/test-windows-regressions.py

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Verify Lite source boundary when present
        run: npm run verify:lite-boundary --if-present
      - name: Frontend tests
        run: npm test
      - name: Build script regressions
        run: npm run test:scripts
      - name: Frontend production build
        run: npm run verify:release-config && npm run verify:deprecations && npm run build:ui
      - name: Verify runtime metadata on every host
        run: npm run verify:runtime-manifest -- --metadata-only
      - name: Verify release payload on target host
        if: runner.os == 'macOS'
        run: npm run verify:runtime-manifest
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust static analysis
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo audit --file app/src-tauri/Cargo.lock

  dws-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Rebuild pinned macOS DWS archives
        run: python scripts/build-dws-isolated.py --target macos --work-dir "$RUNNER_TEMP/dws-build" --output "$RUNNER_TEMP/dws-output"
      - name: Compare archives and audit actual binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for target in darwin-arm64 darwin-x64; do
            cmp "$RUNNER_TEMP/dws-output/package-$target.tgz" "runtime/dws/1.0.65-imboard.1/$target/package.tgz"
            "$(go env GOPATH)/bin/govulncheck" -mode=binary -show=verbose "$RUNNER_TEMP/dws-build/dws-$target"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dws-macos-provenance
          path: ${{ runner.temp }}/dws-output/manifest.json
          if-no-files-found: warn
